services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME:-mediscanflow-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediscanflow}
      POSTGRES_USER: ${POSTGRES_USER:-mediscanflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediscanflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mediscanflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mediscanflow} -d ${POSTGRES_DB:-mediscanflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-mediscanflow-rabbitmq}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mediscanflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-mediscanflow}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - mediscanflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: ${MINIO_CONTAINER_NAME:-mediscanflow-minio}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mediscanflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mediscanflow123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - mediscanflow-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: ${KEYCLOAK_CONTAINER_NAME:-mediscanflow-keycloak}
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: ${KC_HTTP_PORT:-8080}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - mediscanflow-keycloak-data:/opt/keycloak/data
      - ${KEYCLOAK_REALM_IMPORT_FILE:-./keycloak/mediscanflow-realm-dev.json}:/opt/keycloak/data/import/mediscanflow-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/${KC_HTTP_PORT:-8080}'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  medical-platform-service:
    build:
      context: ${BACKEND_BUILD_CONTEXT:-../services/medical-platform-service}
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-mediscanflow-medical-platform-service}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/mediscanflow}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-mediscanflow}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mediscanflow}

      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-mediscanflow}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-mediscanflow}

      APP_STORAGE_MINIO_ENDPOINT: ${APP_STORAGE_MINIO_ENDPOINT:-http://minio:9000}
      APP_STORAGE_MINIO_PUBLIC_ENDPOINT: ${APP_STORAGE_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      APP_STORAGE_MINIO_ACCESS_KEY: ${APP_STORAGE_MINIO_ACCESS_KEY:-mediscanflow}
      APP_STORAGE_MINIO_SECRET_KEY: ${APP_STORAGE_MINIO_SECRET_KEY:-mediscanflow123}
      APP_STORAGE_MINIO_BUCKET: ${APP_STORAGE_MINIO_BUCKET:-medical-scans}
      APP_STORAGE_MINIO_REGION: ${APP_STORAGE_MINIO_REGION:-us-east-1}

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-http://localhost:8081/realms/mediscanflow}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://keycloak:8080/realms/mediscanflow/protocol/openid-connect/certs}

      MEDISCANFLOW_KEYCLOAK_ADMIN_SERVER_URL: ${MEDISCANFLOW_KEYCLOAK_ADMIN_SERVER_URL:-http://keycloak:8080}
      MEDISCANFLOW_KEYCLOAK_ADMIN_REALM: ${MEDISCANFLOW_KEYCLOAK_ADMIN_REALM:-mediscanflow}
      MEDISCANFLOW_KEYCLOAK_ADMIN_CLIENT_ID: ${MEDISCANFLOW_KEYCLOAK_ADMIN_CLIENT_ID:-mediscanflow-admin-api}
      MEDISCANFLOW_KEYCLOAK_ADMIN_CLIENT_SECRET: ${MEDISCANFLOW_KEYCLOAK_ADMIN_CLIENT_SECRET:-KAZ3XeVbTLVxds0ZojKNZ8Re6Pc5tyaL}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/api/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web-app:
    build:
      context: ${WEB_APP_BUILD_CONTEXT:-../services/web-app}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/backend}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://medical-platform-service:8080/api}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-mediscanflow}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-mediscanflow-web}
    container_name: ${WEB_APP_CONTAINER_NAME:-mediscanflow-web-app}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WEB_APP_INTERNAL_PORT:-3000}
      HOSTNAME: ${WEB_APP_HOSTNAME:-0.0.0.0}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/backend}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://medical-platform-service:8080/api}
      NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-mediscanflow}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-mediscanflow-web}
    ports:
      - "${WEB_APP_PORT:-3000}:3000"
    depends_on:
      medical-platform-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-inference-service:
    build:
      context: ${AI_INFERENCE_BUILD_CONTEXT:-../services/ai-inference-service}
      dockerfile: ${AI_INFERENCE_DOCKERFILE:-Dockerfile}
    container_name: ${AI_INFERENCE_CONTAINER_NAME:-mediscanflow-ai-inference-service}
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: ${AI_RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${AI_RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${AI_RABBITMQ_USER:-mediscanflow}
      RABBITMQ_PASSWORD: ${AI_RABBITMQ_PASSWORD:-mediscanflow}

      MINIO_ENDPOINT: ${AI_MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${AI_MINIO_ACCESS_KEY:-mediscanflow}
      MINIO_SECRET_KEY: ${AI_MINIO_SECRET_KEY:-mediscanflow123}
      MINIO_BUCKET: ${AI_MINIO_BUCKET:-medical-scans}
      MINIO_SECURE: ${AI_MINIO_SECURE:-false}

      MODEL_PATH: ${MODEL_PATH:-models/yolov8n-brain-tumor.pt}
      MODEL_NAME: ${MODEL_NAME:-yolo-brain-tumor-detector}
      MODEL_VERSION: ${MODEL_VERSION:-yolov8n}
      YOLO_CONFIDENCE_THRESHOLD: ${YOLO_CONFIDENCE_THRESHOLD:-0.25}
      SIMULATE_INFERENCE_FAILURE: ${SIMULATE_INFERENCE_FAILURE:-false}
      YOLO_CONFIG_DIR: ${YOLO_CONFIG_DIR:-/tmp/Ultralytics}
    volumes:
      - ${AI_MODELS_VOLUME:-../services/ai-inference-service/models}:/app/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  mediscanflow-postgres-data:
  mediscanflow-rabbitmq-data:
  mediscanflow-minio-data:
  mediscanflow-keycloak-data:
