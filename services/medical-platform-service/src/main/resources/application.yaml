spring:
  application:
    name: medical-platform-service

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  validation:
    file-upload:
      max-size-bytes: 10485760
      allowed-content-types:
        - image/jpeg
        - image/png